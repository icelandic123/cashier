name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WALLY_AUTH: ${{ secrets.WALLY_AUTH }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rokit and tools
        run: |
          curl -sSf https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          "$HOME/.rokit/bin/rokit" install --no-trust-check

      - name: Test
        run: lune run tests/run

      - name: Build model
        run: rojo build default.project.json -o Cashier.rbxm

      - name: Create GitHub release
        run: |
          cp src/init.luau Cashier.luau
          gh release create "$VERSION" Cashier.rbxm Cashier.luau \
            --target "$GITHUB_SHA" --title "Cashier $VERSION" --notes-file CHANGELOG.md

      - name: Publish to Wally
        if: env.WALLY_AUTH != ''
        run: |
          wally login --token "$WALLY_AUTH"
          wally publish
